spring:
  application:
    name: LedgerCore

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgercore}
    username: ${SPRING_DATASOURCE_USERNAME:ledgercore}
    password: ${SPRING_DATASOURCE_PASSWORD:ledgercore_dev_password}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

jwt:
  expiration: ${JWT_EXPIRATION:900000}
  key: ${JWT_KEY:development-only-change-this-jwt-key-before-deploying}
