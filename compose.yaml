name: ledgercore

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgercore}
      POSTGRES_USER: ${POSTGRES_USER:-ledgercore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgercore_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    image: ledgercore:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgercore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ledgercore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ledgercore_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      JWT_KEY: ${JWT_KEY:-development-only-change-this-jwt-key-before-deploying}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
